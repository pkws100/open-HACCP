services:
  app:
    build:
      context: .
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD_FILE: /run/secrets/database_password
      DEVICE_API_KEY_PEPPER_FILE: /run/secrets/device_api_key_pepper
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD_FILE: /run/secrets/dashboard_password
    secrets:
      - device_api_key_pepper
      - dashboard_password
      - database_password
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTP_PORT:-18082}:80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  demo:
    build:
      context: .
    profiles: ["demo"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD_FILE: /run/secrets/database_password
      DEVICE_API_KEY_PEPPER_FILE: /run/secrets/device_api_key_pepper
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD_FILE: /run/secrets/dashboard_password
      MIGRATE_ON_START: "false"
      DEMO_API_URL: ${DEMO_API_URL:-http://app}
      DEMO_INTERVAL_SECONDS: ${DEMO_INTERVAL_SECONDS:-300}
      DEMO_STATE_FILE: /var/lib/haccp-demo/state.json
    command: ["php", "tools/demo_fleet.php"]
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - haccp-demo-state:/var/lib/haccp-demo
    secrets:
      - device_api_key_pepper
      - dashboard_password
      - database_password
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD_FILE: /run/secrets/database_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/database_root_password
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - haccp-db-data:/var/lib/mysql
    secrets:
      - database_password
      - database_root_password
    restart: unless-stopped

  test-db:
    image: mariadb:10.11
    profiles: ["test"]
    environment:
      MARIADB_DATABASE: haccp_test
      MARIADB_USER: haccp_test
      MARIADB_PASSWORD: haccp_test_password
      MARIADB_ROOT_PASSWORD: haccp_test_root_password
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/mysql

  tests:
    build:
      context: .
    profiles: ["test"]
    entrypoint: ["/bin/sh", "-c"]
    command: ["vendor/bin/phinx migrate -e test && vendor/bin/phpunit"]
    environment:
      APP_ENV: test
      APP_DEBUG: "false"
      APP_TIMEZONE: UTC
      MIGRATE_ON_START: "false"
      DB_HOST: test-db
      DB_PORT: 3306
      DB_DATABASE: haccp_test
      DB_USERNAME: haccp_test
      DB_PASSWORD: haccp_test_password
      DEVICE_API_KEY_PEPPER: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DASHBOARD_USERNAME: haccp-test
      DASHBOARD_PASSWORD: haccp-test-dashboard-password
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  haccp-db-data:
  haccp-demo-state:

secrets:
  device_api_key_pepper:
    environment: DEVICE_API_KEY_PEPPER
  dashboard_password:
    environment: DASHBOARD_PASSWORD
  database_password:
    environment: DB_PASSWORD
  database_root_password:
    environment: DB_ROOT_PASSWORD
