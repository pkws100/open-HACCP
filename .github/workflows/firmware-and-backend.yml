name: Firmware and backend checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: PHP and MariaDB tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: haccp_test
          MARIADB_USER: haccp_test
          MARIADB_PASSWORD: haccp_test_password
          MARIADB_ROOT_PASSWORD: haccp_test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=30
    env:
      APP_ENV: test
      APP_DEBUG: 'false'
      APP_TIMEZONE: UTC
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: haccp_test
      DB_USERNAME: haccp_test
      DB_PASSWORD: haccp_test_password
      DEVICE_API_KEY_PEPPER: a1b2c3d4e5f60718a1b2c3d4e5f60718a1b2c3d4e5f60718a1b2c3d4e5f60718
      AUDIT_LOG_KEY: 13579bdf2468ace013579bdf2468ace013579bdf2468ace0
      DASHBOARD_USERNAME: haccp-test
      DASHBOARD_PASSWORD: haccp-test-dashboard-password
      PUBLIC_API_BASE_URL: https://haccp.pow24.org
      EXPORT_PATH: /tmp/haccp-exports
      MEDIA_PATH: /tmp/haccp-media
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, gd, imagick, mbstring, pdo_mysql, zip
          coverage: none
      - name: Create writable media and export directories
        run: mkdir -p "$EXPORT_PATH" "$MEDIA_PATH"
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Migrate test database
        run: vendor/bin/phinx migrate -e test
      - name: Run backend tests
        run: vendor/bin/phpunit
      - name: Run dashboard JavaScript tests
        run: node --test tests/JavaScript/*.mjs

  firmware:
    name: ${{ matrix.profile.name }} build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile:
          - name: ESP32-S3 SHT45
            project: firmware/esp32-s3
            environment: esp32-s3-devkitc-1
          - name: ESP32 WROOM DHT22
            project: firmware/esp32-s3
            environment: esp32-wroom-dht22
          - name: ESP32 WROOM DHT22 sleep
            project: firmware/esp32-s3
            environment: esp32-wroom-dht22-sleep
          - name: ESP32 WROOM DHT22 battery unmonitored
            project: firmware/esp32-s3
            environment: esp32-wroom-dht22-battery-unmonitored
          - name: ESP32 WROOM DHT22 battery unmonitored sleep
            project: firmware/esp32-s3
            environment: esp32-wroom-dht22-battery-unmonitored-sleep
          - name: ESP8266 D1 mini DHT22
            project: firmware/esp8266-d1-mini
            environment: d1-mini-dht22
          - name: ESP8266 D1 mini DHT22 sleep
            project: firmware/esp8266-d1-mini
            environment: d1-mini-dht22-sleep
          - name: ESP8266 D1 mini DHT22 battery unmonitored
            project: firmware/esp8266-d1-mini
            environment: d1-mini-dht22-battery-unmonitored
          - name: ESP8266 D1 mini DHT22 battery unmonitored sleep
            project: firmware/esp8266-d1-mini
            environment: d1-mini-dht22-battery-unmonitored-sleep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.1.18'
      - name: Create nonsecret CI setup password
        working-directory: ${{ matrix.profile.project }}
        run: |
          printf '%s\n' '#pragma once' '#define OPEN_HACCP_SETUP_AP_PASSWORD "ci-test-only-password-2026"' > include/BuildSecrets.h
      - name: Build profile
        run: pio run -d '${{ matrix.profile.project }}' -e '${{ matrix.profile.environment }}'
      - name: Test queue, sensor ranges and ACK correlation on host
        if: matrix.profile.environment == 'esp32-s3-devkitc-1'
        run: sh firmware/esp32-s3/tests/run_host_tests.sh
