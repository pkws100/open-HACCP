[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson@7.4.2
  adafruit/Adafruit SHT4x Library@1.0.5

[env:esp32-s3-devkitc-1-sleep-fallback]
extends = env:esp32-s3-devkitc-1
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D OPEN_HACCP_DISABLE_DEEP_SLEEP=1

; Generic ESP-WROOM-32 build target. Confirm the exact USB/UART chip and flash
; size on the physical board before uploading; esp32dev is not an exact
; identification of the photographed board.
[env:esp32-wroom-dht22]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D OPEN_HACCP_SENSOR_DHT22=1
  -D OPEN_HACCP_DISABLE_DEEP_SLEEP=1
lib_deps =
  bblanchon/ArduinoJson@7.4.2
  adafruit/DHT sensor library@1.4.6

; Enable timer deep sleep only after the first USB, sensor and wake tests.
[env:esp32-wroom-dht22-sleep]
extends = env:esp32-wroom-dht22
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D OPEN_HACCP_SENSOR_DHT22=1
  -D OPEN_HACCP_DISABLE_DEEP_SLEEP=0
