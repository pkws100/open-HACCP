[platformio]
default_envs = d1-mini-dht22

[env:d1-mini-dht22]
platform = platformio/espressif8266@4.2.1
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
  -D OPEN_HACCP_ENABLE_DEEP_SLEEP=0
lib_deps =
  bblanchon/ArduinoJson@7.4.2
  adafruit/DHT sensor library@1.4.6

[env:d1-mini-dht22-sleep]
extends = env:d1-mini-dht22
build_flags =
  -D OPEN_HACCP_ENABLE_DEEP_SLEEP=1
